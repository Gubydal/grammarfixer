[package]
name = "harper_bridge"
version = "0.1.0"
edition = "2021"
authors = ["Mogate <mogatebusiness@gmail.com>"]
description = "Production C-ABI and JNI wrapper for Harper on-device grammar checker in GrammarFix"
license = "Apache-2.0"

[lib]
name = "harper_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
harper-core = { version = "0.19", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
jni = { version = "0.21", optional = true }

[features]
default = []
jni-export = ["dep:jni"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
