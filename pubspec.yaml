name: app_starter
description: "Production-ready Android Flutter starter with Supabase auth, RevenueCat, AdMob, a reusable design system, and Google Play readiness."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: any
  flutter_bloc: ^9.1.1
  supabase_flutter: ^2.17.1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.0.0
  purchases_flutter: ^10.8.0
  google_mobile_ads: ^9.0.0
  in_app_update: ^4.2.5
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/assets/
    - lib/assets/icons/

  fonts:
    - family: LexendDeca
      fonts:
        - asset: lib/assets/fonts/LexendDeca.ttf
    - family: Rubik
      fonts:
        - asset: lib/assets/fonts/Rubik.ttf
